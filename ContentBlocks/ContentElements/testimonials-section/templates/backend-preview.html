<f:layout name="Preview"/>

<f:section name="Content">

<style>
#reviews .reviews-carousel {display: flex;justify-content: center;padding: 20px;} #reviews .reviews-carousel .reviews-thumb:first-child {display: block !important;width: 50%;background-color: black;color: white;padding: 20px;border-radius: 10px;}#reviews .reviews-stars { width: 100%; margin-bottom: 10px; color: #f7c948;}#reviews .reviews-carousel .reviews-thumb:first-child { color: whit }
#reviews figcaption { display: flex; align-items: center; }#reviews .reviews-image { width: 50px; border-radius: 50%;}
.t3-page-ce-body img {height: auto;max-width: 100%;} #reviews figcaption span {font-size: 0.875rem;margin-left: 4px;}#reviews figcaption strong{margin-left: 7px;}
</style>

  <section class="section-padding pb-0" id="reviews">
    <div class="container">
      <div class="row">
        <div class="col-12">

          <f:if condition="{data.header}">
            <h2 class="text-center mb-lg-5 mb-4">{data.header}</h2>
          </f:if>

          <f:if condition="{data.tx_mask_testimonial}">
            <div class="owl-carousel reviews-carousel">

              <f:for each="{data.tx_mask_testimonial}" as="item" iteration='i'>
                <f:if condition="{i.isFirst}">
                  <figure class="reviews-thumb d-flex flex-wrap align-items-center">

                    <div class="reviews-stars">
                        <f:alias map="{num:{0:1,1:2,2:3,3:4,4:5}}">
                            <f:for each="{num}" as="index" iteration="i">
                                <f:if condition="{i.cycle} <= {item.tx_mask_stars}">
                                    <f:then>
                                        <i class="bi-star-fill"></i>
                                    </f:then>
                                    <f:else>
                                        <i class="bi-star"></i>
                                    </f:else>
                                </f:if>
                            </f:for>
                        </f:alias>
                    </div>

                    <f:if condition="{item.tx_mask_review}">
                      {item.tx_mask_review -> f:format.raw()}
                    </f:if>
                    <figcaption class="ms-4">
                    <f:image image="{item.tx_mask_image.0}"
                      class="img-fluid reviews-image" />
                      <strong>{item.tx_mask_image.0.title}</strong>
                      <span class="text-muted">
                        {item.tx_mask_image.0.description}
                      </span>
                    </figcaption>
                  </figure>
                </f:if>

              </f:for>
            </div>
          </f:if>

        </div>
      </div>
    </div>
  </section>
</f:section>
